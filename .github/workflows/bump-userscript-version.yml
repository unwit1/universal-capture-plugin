name: Bump userscript version

on:
  push:
    branches: [main]
    paths:
      - "agent-os-universal-capture.user.js"

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Increment patch version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("agent-os-universal-capture.user.js")
          text = path.read_text(encoding="utf-8")

          match = re.search(r"(?m)^// @version\s+(\d+)\.(\d+)\.(\d+)\s*$", text)
          if not match:
              raise SystemExit("Expected numeric x.y.z @version metadata")

          major, minor, patch = map(int, match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"

          text = re.sub(
              r"(?m)^// @version\s+\d+\.\d+\.\d+\s*$",
              f"// @version      {new_version}",
              text,
              count=1,
          )
          text = re.sub(
              r'var VERSION = "\d+\.\d+\.\d+";',
              f'var VERSION = "{new_version}";',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          print(new_version)
          PY

      - name: Commit version bump
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-os-universal-capture.user.js
          git commit -m "Bump userscript version"
          git push
